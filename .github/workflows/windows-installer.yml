name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "game.js"
      - "game-core.js"
      - "index.html"
      - "styles.css"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AFTERGLOW_QA: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install declared dependencies
        run: npm ci --no-audit --no-fund

      - name: Test scoring and Gamer Percentage
        run: npm test

      - name: Prepare isolated QA profile
        shell: pwsh
        run: |
          $profilePath = Join-Path $env:RUNNER_TEMP "Afterglow-Arcade-QA"
          New-Item -ItemType Directory -Force -Path $profilePath | Out-Null
          "AFTERGLOW_USER_DATA_DIR=$profilePath" >> $env:GITHUB_ENV

      - name: Play all six games in Electron
        run: npm run qa

      - name: Verify scores survive an app restart
        run: npm run qa

      - name: Build the Windows NSIS installer
        run: npm run dist -- --x64

      - name: Install and launch the built app
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath "dist/Afterglow-Arcade-Club-Setup.exe"
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)" }
          $appExe = Get-ChildItem -LiteralPath "$env:LOCALAPPDATA/Programs" -Filter "Afterglow Arcade Club.exe" -File -Recurse | Select-Object -First 1
          if (-not $appExe) { throw "Installed application executable was not found" }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = Get-ChildItem -LiteralPath "$env:USERPROFILE/Desktop" -Filter "*.lnk" -File | Where-Object { $_.Name -like "*Afterglow*" } | Select-Object -First 1
          if (-not $shortcut) { throw "Desktop shortcut was not created" }
          $link = $shell.CreateShortcut($shortcut.FullName)
          if ([IO.Path]::GetFullPath($link.TargetPath) -ne [IO.Path]::GetFullPath($appExe.FullName)) { throw "Desktop shortcut points to the wrong executable" }
          $env:AFTERGLOW_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "Afterglow-Installed-QA"
          New-Item -ItemType Directory -Force -Path $env:AFTERGLOW_USER_DATA_DIR | Out-Null
          & $appExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed app QA failed with exit code $LASTEXITCODE" }

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --jq ".[].tagName"
          if ($tags -contains $tag) {
            Write-Host "Release $tag already exists; leaving the published asset unchanged."
          } else {
            $asset = (Resolve-Path -LiteralPath "dist/Afterglow-Arcade-Club-Setup.exe").Path
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title "$($package.build.productName) $($package.version)" --notes "Windows 10/11 x64 installer. Guest progress is saved locally. Online accounts and cloud sync are not configured."
          }

      - name: Keep an installer artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Arcade-Club-Windows-Installer
          path: dist/Afterglow-Arcade-Club-Setup.exe
          if-no-files-found: error
          retention-days: 7
